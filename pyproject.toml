[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "id-seismic-lakehouse"
version = "0.1.0"
description = "End-to-end ELT for Indonesian seismicity: USGS -> DuckDB -> dbt -> static dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aaageee" }]
dependencies = [
  "duckdb>=1.0,<3",
  "dbt-duckdb>=1.8,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: builds the dbt project against the sample data (slow)",
]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
