name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Build the warehouse from the sample lake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline pipeline build (no network, committed sample)
        run: make demo

      - name: Unit + integration tests
        run: make test

      - name: Lint
        run: make lint

      - name: Upload the demo dashboard
        uses: actions/upload-artifact@v4
        with:
          name: demo-dashboard
          path: build/demo/dashboard
          retention-days: 14
